name: check-pr

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Application Runtime
        uses: ./.github/actions/setup-application-runtime

      - name: Analyze package and example
        run: flutter analyze --fatal-infos --no-pub

      - name: Check format
        run: sh tool/check_format.sh

      - name: Test
        run: flutter test --no-pub

      - name: Test example workflows
        working-directory: example
        run: flutter test --no-pub

  minimum-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.7.0"
          channel: stable
          cache: true

      # The example uses Dart 3, but the package still supports Dart 2.19.
      # dart pub get resolves only this package on the minimum SDK.
      - name: Install package dependencies
        run: dart pub get

      - name: Analyze package on minimum SDK
        run: |
          dart analyze --fatal-infos lib
          dart analyze --fatal-infos test

      - name: Test on minimum SDK
        run: flutter test --no-pub

  patrol:
    name: Patrol iOS regression
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-application-runtime
      - name: Run the regression suite on an iPhone simulator
        run: bash tool/patrol_ios.sh
      - name: Upload Patrol diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: patrol-results
          retention-days: 7
          path: |
            example/build/ios_integ/Logs/Test/*.xcresult
            example/build/*_results_*.xcresult
            example/build/patrol_results*
            example/build/patrol_logs*
          if-no-files-found: ignore
